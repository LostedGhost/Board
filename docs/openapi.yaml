openapi: 3.0.3
info:
  title: LuluBoard API
  version: 0.1.0
paths:
  /api/v1/appareils:
    get:
      operationId: appareils_list
      tags:
      - appareils
      security:
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appareil'
          description: ''
  /api/v1/appareils/{appareil_id}:
    patch:
      operationId: appareils_partial_update
      parameters:
      - in: path
        name: appareil_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appareils
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRenommer'
      security:
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appareil'
          description: ''
    delete:
      operationId: appareils_destroy
      parameters:
      - in: path
        name: appareil_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appareils
      security:
      - session: []
      responses:
        '204':
          description: No response body
  /api/v1/appareils/courant/deverrouillage:
