components:
  schemas:
    AcceptationConditions:
      type: object
      properties:
        versionIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - versionIds
    AccesFichier:
      type: object
      properties:
        mode:
          type: string
        url:
          type: string
      required:
      - mode
      - url
    Appareil:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nom:
          type: string
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeAppareil'
          readOnly: true
        plateforme:
          type: string
          readOnly: true
        versionApp:
          type: string
        statut:
          allOf:
          - $ref: '#/components/schemas/StatutAppareil'
          readOnly: true
        ajouteLe:
          type: string
          format: date-time
        derniereActiviteLe:
          type: string
          format: date-time
        courant:
          type: boolean
          readOnly: true
      required:
      - ajouteLe
      - courant
      - derniereActiviteLe
      - id
      - nom
      - plateforme
      - statut
      - type
      - versionApp
    AppareilExistant:
      type: object
      properties:
        appareilId:
          type: string
          format: uuid
      required:
      - appareilId
    AppareilNouveau:
      type: object
      properties:
        nom:
          type: string
          maxLength: 100
          minLength: 1
        type:
          $ref: '#/components/schemas/TypeAppareil'
        plateforme:
          type: string
          maxLength: 50
          minLength: 1
        versionApp:
          type: string
          maxLength: 20
          pattern: ^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$
        clePublique:
          type: string
          format: base64url
      required:
      - clePublique
      - nom
      - plateforme
      - type
      - versionApp
    AppareilNouveauOuExistant:
      oneOf:
      - $ref: '#/components/schemas/AppareilNouveau'
      - $ref: '#/components/schemas/AppareilExistant'
    Approbation:
      type: object
      properties:
        codeAffiche:
          type: string
          pattern: ^\d{6}$
        cleMaitreEnveloppee:
          type: string
          format: base64url
      required:
      - cleMaitreEnveloppee
      - codeAffiche
    Changement:
      type: object
      properties:
        entite:
          $ref: '#/components/schemas/EntiteEnum'
        id:
          type: string
          format: uuid
        modifieLe:
          type: string
          format: date-time
        supprimeLe:
          type: string
          format: date-time
          nullable: true
        donnees:
          type: object
          additionalProperties: {}
      required:
      - entite
      - id
      - modifieLe
    ChangementEmail:
      type: object
      properties:
        motDePasse:
          type: string
          maxLength: 128
        idTokenGoogle:
          type: string
          maxLength: 4096
        nouvelEmail:
          type: string
          format: email
          maxLength: 254
      required:
      - nouvelEmail
    ChangementMotDePasse:
      type: object
      properties:
        ancienMotDePasse:
          type: string
          maxLength: 128
        nouveauMotDePasse:
          type: string
          maxLength: 128
        deconnecterAutresAppareils:
          type: boolean
          default: false
      required:
      - nouveauMotDePasse
    Changements:
      type: object
      properties:
        versionCourante:
          type: integer
        changements:
          type: array
          items:
            type: object
            additionalProperties: {}
        encore:
          type: boolean
      required:
      - changements
      - encore
      - versionCourante
    ClesInitiales:
      type: object
      properties:
        enveloppeRecuperation:
          type: string
          format: base64url
        enveloppeAppareil:
          type: string
          format: base64url
        clePubliqueVerification:
          type: string
          format: base64url
      required:
      - clePubliqueVerification
      - enveloppeAppareil
      - enveloppeRecuperation
    CodeEmail:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    Compte:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nomAffichage:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/StatutCompte'
          readOnly: true
        aMotDePasse:
          type: boolean
          readOnly: true
        googleLie:
          type: boolean
        cleRecuperationConfirmee:
          type: boolean
          readOnly: true
        suppressionPrevueLe:
          type: string
          format: date-time
        creeLe:
          type: string
          format: date-time
      required:
      - aMotDePasse
      - cleRecuperationConfirmee
      - creeLe
      - email
      - googleLie
      - id
      - nomAffichage
      - role
      - statut
      - suppressionPrevueLe
    CompteDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nomAffichage:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/StatutCompte'
          readOnly: true
        aMotDePasse:
          type: boolean
          readOnly: true
        googleLie:
          type: boolean
        cleRecuperationConfirmee:
          type: boolean
          readOnly: true
        suppressionPrevueLe:
          type: string
          format: date-time
        creeLe:
          type: string
          format: date-time
        conditionsAAccepter:
          type: array
          items: {}
          readOnly: true
      required:
      - aMotDePasse
      - cleRecuperationConfirmee
      - conditionsAAccepter
      - creeLe
      - email
      - googleLie
      - id
      - nomAffichage
      - role
      - statut
      - suppressionPrevueLe
    Connexion:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        motDePasse:
          type: string
          maxLength: 128
        appareil:
          $ref: '#/components/schemas/AppareilNouveauOuExistant'
      required:
      - appareil
      - email
      - motDePasse
    Demande:
      type: object
      description: DemandeDeverrouillageDTO. Le code n'est montré qu'à l'appareil
        demandeur.
      properties:
        id:
          type: string
          format: uuid
        statut:
          type: string
        expireLe:
          type: string
          format: date-time
        appareilDemandeur:
          type: object
          additionalProperties: {}
          readOnly: true
        clePubliqueDemandeur:
          type: string
      required:
      - appareilDemandeur
      - clePubliqueDemandeur
      - expireLe
      - id
      - statut
    DemandeAvecCode:
      type: object
      description: DemandeDeverrouillageDTO. Le code n'est montré qu'à l'appareil
        demandeur.
      properties:
        id:
          type: string
          format: uuid
        statut:
          type: string
        expireLe:
          type: string
          format: date-time
        appareilDemandeur:
          type: object
          additionalProperties: {}
          readOnly: true
        clePubliqueDemandeur:
          type: string
        codeAffiche:
          type: string
      required:
      - appareilDemandeur
      - clePubliqueDemandeur
      - codeAffiche
      - expireLe
      - id
