[project]
name = "luluboard-backend"
version = "0.1.0"
description = "API de LuluBoard (monolithe modulaire Django)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "channels>=4.2",
    "channels-redis>=4.2",
    "celery>=5.5",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.1",
    "httpx>=0.28",
    "google-auth>=2.40",
    "requests>=2.32",
    "pynacl>=1.5",
    "uvicorn[standard]>=0.34",
    "django-cors-headers>=4.6",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "daphne>=4.1",
    "pytest>=8.3",
    "pytest-django>=4.10",
    "respx>=0.22",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests_*.py", "test_*.py"]
addopts = "-q"

[tool.uv]
package = false
