<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo LuluBoard : une note au coin replié, marquée d'un « L », sur fond vert (accent du design system). -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="pli" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
  </defs>
  <rect id="carre" width="512" height="512" rx="116" fill="url(#fond)"/>
  <g id="note" transform="rotate(-6 256 256)">
    <path d="M150 112 h212 a26 26 0 0 1 26 26 v170 l-92 92 h-146 a26 26 0 0 1 -26 -26 v-236 a26 26 0 0 1 26 -26 z" fill="#020617" opacity=".18" transform="translate(6 12)"/>
    <path d="M150 112 h212 a26 26 0 0 1 26 26 v170 l-92 92 h-146 a26 26 0 0 1 -26 -26 v-236 a26 26 0 0 1 26 -26 z" fill="#FFFFFF"/>
    <path d="M388 308 l-92 92 v-66 a26 26 0 0 1 26 -26 z" fill="url(#pli)"/>
    <path d="M186 168 v156 h96" fill="none" stroke="#14532D" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="324" cy="168" r="20" fill="#22C55E"/>
  </g>
</svg>
