name: Build APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publication de la release « apk-latest »
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - run: flutter pub get

      # Adresse de l'API compilée dans l'app (variable de dépôt API_URL, sinon le service Render par défaut).
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://luluboard-api.onrender.com' }}

      # APK léger pour les téléphones récents (arm64 uniquement), en plus de l'APK universel.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=API_URL=${{ vars.API_URL || 'https://luluboard-api.onrender.com' }}

      - uses: actions/upload-artifact@v4
        with:
          name: luluboard-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Lien de téléchargement stable : release « apk-latest », remplacée à chaque build.
      - name: Publier la release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk luluboard.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk luluboard-arm64.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest luluboard.apk luluboard-arm64.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "LuluBoard Android (dernière build)" \
            --notes "APK construit depuis ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
