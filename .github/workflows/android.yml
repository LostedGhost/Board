name: Build APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - run: flutter pub get

      # Adresse de l'API compilée dans l'app (variable de dépôt API_URL, sinon le service Render par défaut).
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://luluboard-api.onrender.com' }}

      - uses: actions/upload-artifact@v4
        with:
          name: luluboard-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
